name: Build and Release on Tag

on:
  push:
    tags:
      - 'v*' 

jobs:
  build:
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build for ${{ matrix.platform }}
        run: |
          mkdir -p bin
          export GOOS=$(echo ${{ matrix.platform }} | cut -d'/' -f1)
          export GOARCH=$(echo ${{ matrix.platform }} | cut -d'/' -f2)
          make release

      - name: Upload magicToolkit
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/magicToolkit.zip
          asset_name: magicToolkit-${{ github.ref_name }}-${{ matrix.platform }}.zip
          asset_content_type: application/zip
