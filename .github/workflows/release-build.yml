name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - 'feature/*'
      - 'bugfix/*'
    tags:
      - 'v*'

jobs:
  test:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Run Tests
        run: |
          go test ./... -v

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 60
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build for ${{ matrix.platform }}
        timeout-minutes: 60
        run: |
          prePath=$(pwd)
          sudo apt update
          sudo apt install -y cmake g++ git make \
              libboost-all-dev libssl-dev zlib1g-dev \
              libprotobuf-dev protobuf-compiler

          git clone https://github.com/apache/arrow.git
          cd arrow/cpp
          mkdir build && cd build

          cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DARROW_COMPUTE=ON \
            -DARROW_PARQUET=ON \
            -DARROW_CSV=ON \
            -DARROW_JSON=ON \
            -DARROW_FILESYSTEM=ON

          make -j$(nproc)
          sudo make install

          # 设置 Go 编译环境
          export CGO_CFLAGS="-I/usr/local/include"
          export CGO_LDFLAGS="-L/usr/local/lib -larrow -lparquet"
          cd ${prePath}
          mkdir -p bin build/magicCodeAgent
          export GOOS=$(echo ${{ matrix.platform }} | cut -d'/' -f1)
          export GOARCH=$(echo ${{ matrix.platform }} | cut -d'/' -f2)
          make release || (echo "Build failed with exit code $?"; exit 1)

      - name: Get Release
        id: get_release
        uses: actions/github-script@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: '${{ github.ref_name }}'
              })
              core.setOutput('upload_url', release.data.upload_url)
              return release.data.id
            } catch (error) {
              if (error.status === 404) {
                const newRelease = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: '${{ github.ref_name }}',
                  name: 'Release ${{ github.ref_name }}',
                  draft: false,
                  prerelease: false
                })
                core.setOutput('upload_url', newRelease.data.upload_url)
                return newRelease.data.id
              }
              throw error
            }

      - name: Upload magicCodeAgent
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: ./build/magicCodeAgent.zip
          asset_name: magicCodeAgent-${{ github.ref_name }}-${{ matrix.platform }}.zip
          asset_content_type: application/zip
